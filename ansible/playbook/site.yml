- name: Préparation des nœuds
  hosts: k3s_cluster
  become: true
  gather_facts: false
  tasks:
    - name: Installer qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        update_cache: true

- name: Import kube cluster playbook
  ansible.builtin.import_playbook: k3s.orchestration.site
